# Stack "admin-only" : Strapi seul, sans front ni Caddy.
# Sert à installer/administrer le CMS AVANT d'avoir configuré le DNS.
# Le port est lié à 127.0.0.1 : Strapi n'est PAS exposé sur Internet,
# on y accède uniquement via un tunnel SSH.
#
# Sur le VPS :
#   docker compose -f docker-compose.admin.yml --env-file .env up -d --build
#
# Depuis ton PC :
#   ssh -L 1337:localhost:1337 root@IP_DU_VPS
#   puis ouvrir http://localhost:1337/admin
#
# Les volumes portent le même nom que dans docker-compose.prod.yml :
# le contenu saisi ici sera conservé lors du passage en prod (même dossier projet).
services:
  backend:
    build:
      context: ./apps/back
      dockerfile: Dockerfile
    container_name: backend
    restart: unless-stopped
    env_file: .env
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=1337
      - DATABASE_CLIENT=sqlite
      - DATABASE_FILENAME=.tmp/data.db
      # Accès direct (tunnel SSH), pas derrière un proxy pour l'instant :
      - IS_PROXIED=false
      - PUBLIC_URL=http://localhost:1337
    volumes:
      - strapi-data:/app/.tmp
      - strapi-uploads:/app/public/uploads
    ports:
      - "127.0.0.1:1337:1337"

volumes:
  strapi-data:
  strapi-uploads:
